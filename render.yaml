# Render Blueprint: backend (FastAPI), frontend (Next.js), Postgres.
# Secrets are NOT stored here: values marked `sync: false` are entered in the Render dashboard.
# Variable names are exactly those in .env.example.
databases:
  - name: staycovered-db
    plan: free
    databaseName: staycovered
    user: staycovered

services:
  - type: web
    name: staycovered-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: staycovered-db
          property: connectionString
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PUBLIC_BASE_URL # https://staycovered-api.onrender.com ; webhook = $PUBLIC_BASE_URL/api/webhooks/paypal
        sync: false
      - key: FRONTEND_ORIGIN # https://staycovered-web.onrender.com
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: AI_CONFIDENCE_THRESHOLD
        value: "0.7"
      - key: FILE_STORAGE_PATH
        value: ./uploads
      - key: SIGNATURE_THRESHOLD_USD
        value: "750"
      - key: AUTO_SUBMIT_EVIDENCE
        value: "false"

  - type: web
    name: staycovered-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24.11.1
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID # needed at BUILD time (inlined into the browser bundle)
        sync: false
      - key: NEXT_PUBLIC_API_BASE_URL # https://staycovered-api.onrender.com
        sync: false
